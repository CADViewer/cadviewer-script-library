<VirtualHost *:80>
    DocumentRoot /var/www/html

    # Behind the Coolify/Traefik proxy: let PHP build https URLs
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Sample files loaded cross-origin by the npm samples (formerly served by
    # onlinedemo.cadviewer.com/cadviewer_7_0/php/load-demo-file-npm-install.php)
    <Directory /var/www/html/cadviewer/content/npm-demo>
        Header set Access-Control-Allow-Origin "*"
    </Directory>

    # Converter binaries and license keys are not meant to be downloaded
    <Directory /var/www/html/cadviewer/converters>
        Require all denied
    </Directory>
    <Directory /var/www/html/cadviewer/converters/files>
        Require all granted
    </Directory>

    # cadviewer-php-scripts ships diagnostics, logs and SQL dumps that must not be reachable
    <Directory /var/www/html/cadviewer/php>
        <FilesMatch "^(phpinfo|phpversion|whoami2?|checkmail|info|testrun)\.php$|\.(sql|txt|log|bak)$">
            Require all denied
        </FilesMatch>
    </Directory>
    <Directory /var/www/html/cadviewer/php/logs>
        Require all denied
    </Directory>
    <Directory /var/www/html/cadviewer/php/legacy_php>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
